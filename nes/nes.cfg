MEMORY {
  ZP:   start = $0000, size = $0100, type = rw;
  OAMR: start = $0200, size = $0100, type = rw;
  RAM:  start = $0300, size = $0500, type = rw;
  HDR:  start = $0000, size = $0010, file = %O, fill = yes;
  PRG:  start = $8000, size = $7F00, file = %O, fill = yes, fillval = $FF;
  STB:  start = $FF00, size = $00FA, file = %O, fill = yes, fillval = $FF;
  VEC:  start = $FFFA, size = $0006, file = %O, fill = yes;
  CHR:  start = $0000, size = $40000, file = %O, fill = yes;
}
SEGMENTS {
  ZEROPAGE: load = ZP,   type = zp;
  OAM:      load = OAMR, type = bss, align = 256;
  BSS:      load = RAM,  type = bss;
  HEADER:   load = HDR,  type = ro;
  CODE:     load = PRG,  type = ro;
  RODATA:   load = PRG,  type = ro;
  STUB:     load = STB,  type = ro;
  VECTORS:  load = VEC,  type = ro;
  CHARS:    load = CHR,  type = ro;
}
